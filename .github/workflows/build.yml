name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Buildozer global directory (~/.buildozer)
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-global-v4-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-global-v4-

    - name: Cache project .buildozer directory
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: ${{ runner.os }}-v4-${{ hashFiles('buildozer.spec') }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk python3-pip python3-dev python3-setuptools python3-venv \
          autoconf automake libtool libltdl-dev pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
          ccache patch lld gettext
        pip3 install --user --upgrade buildozer cython virtualenv "setuptools==69.5.1" "wheel==0.44.0"

    - name: Build with Buildozer
      run: |
        set -o pipefail
        export PATH="$HOME/.local/bin:$PATH"
        cat << 'EOF' > /tmp/pip_constraints.txt
        setuptools==69.5.1
        wheel==0.44.0
        EOF
        export PIP_CONSTRAINT=/tmp/pip_constraints.txt
        buildozer android debug 2>&1 | tee buildozer_output.log

    - name: Show Build Error Tail on Failure
      if: failure()
      run: |
        echo "### Last 100 lines of Buildozer Log" >> $GITHUB_STEP_SUMMARY
        echo '```text' >> $GITHUB_STEP_SUMMARY
        tail -n 100 buildozer_output.log >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        tail -n 100 buildozer_output.log

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: calorie-tracker-apk
        path: bin/*.apk
